name: Frontend CI
run-name: Verifying that frontend is in good conditions 🖼️
on:
  push:
    branches:
      - main
      - dev
    paths:
      - frontend/**
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: npm install
      
      - name: Run formatter
        run: npm run format:check

      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_MOVIE_API_URL: ${{ secrets.MOVIE_API_URL }}
          VITE_MOVIE_API_KEY: ${{ secrets.MOVIE_API_KEY }}
          VITE_MOVIE_API_IMAGES_URL: ${{ secrets.MOVIE_API_IMAGES_URL }}
          VITE_MOVIE_API_URL_2: ${{ secrets.MOVIE_API_URL_2 }}
          VITE_MOVIE_API_KEY_2: ${{ secrets.MOVIE_API_KEY_2 }}
      
      - name: Verify build output
        run: |
          ls -la build/
          echo "Build folder contents:"
          find build/ -type f | head -10
      
      - name: Upload build output
        uses: actions/upload-artifact@v7.0.0
        with:
          name: build-files
          path: frontend/build/
          if-no-files-found: error
          retention-days: 1
      
      - name: Generate netlify.toml
        run: |
          cat > build/netlify.toml << EOF
          [[redirects]]
            from = "/auth/*"
            to = "${{ secrets.BACKEND_URL }}/auth/:splat"
            status = 200

          [[redirects]]
            from = "/api/*"
            to = "${{ secrets.BACKEND_URL }}/api/:splat"
            status = 200

          [[redirects]]
            from = "/*"
            to = "/index.html"
            status = 200
          EOF
      
      - name: Copy netlify.toml to build
        run: cp netlify.toml build/netlify.toml
      
  deploy:
    # Only run this job if the branch is main and build job has passed
    if: github.ref == 'refs/heads/main'
    name: Deploy to production environment
    runs-on: ubuntu-latest
    needs: build

    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PROJECT_ID: ${{ secrets.NETLIFY_PROJECT_ID }}
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Download build output
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-files
          path: frontend/build/
      
      - name: Verify downloaded build
        run: |
          ls -la build/
          echo "Downloaded build folder contents:"
          find build/ -type f | head -10

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Check existing Netlify projects
        run: netlify sites:list --auth $NETLIFY_AUTH_TOKEN

      - name: Deploy to production environment
        run: netlify deploy --no-build --dir=build --prod --site=$NETLIFY_PROJECT_ID --auth=$NETLIFY_AUTH_TOKEN

