name: Backend CI
run-name: Verifying that backend is in good conditions 🏭
on:
  push:
    branches:
      - master
      - develop
    paths:
      - backend/**
  workflow_dispatch:

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    container: python:3.13.3-slim
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: pip3 install --no-cache-dir --upgrade -r requirements.txt
      
      - name: Run linter
        run: ruff check
      
      - name: Run tests
        run: pytest
      
  deploy:
    # Only run this job if the branch is master and build job has passed
    if: github.ref == 'refs/heads/master'
    name: Deploy to production environment
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Render CLI
        run: |
          mkdir -p /tmp/render
          curl -L https://github.com/render-oss/cli/releases/download/v1.1.0/cli_1.1.0_linux_amd64.zip -o /tmp/render/render.zip
          cd /tmp/render
          unzip render.zip
          sudo mv cli_v1.1.0 /usr/local/bin/render
          cd -
          rm -rf /tmp/render
      
      - name: Trigger deploy with Render CLI
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CI: true
        run: |
          render deploys create ${{ secrets.RENDER_SERVICE_ID }} --output json --confirm