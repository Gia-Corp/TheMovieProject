name: Backend CI
run-name: Verifying that backend is in good conditions 🏭
on:
  push:
    branches:
      - master
      - develop
    paths:
      - backend/**
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    container: python:3.13.3-slim
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      
      - name: Install dependencies
        run: pip3 install --no-cache-dir --upgrade -r requirements.txt
      
      - name: Run linter
        run: ruff check
      
      - name: Run tests
        run: pytest
      
  deploy:
    # Only run this job if the branch is master and build job has passed
    if: github.ref == 'refs/heads/master'
    name: Deploy to production environment
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Deploy
        env:
          deploy_url: ${{ secrets.BACKEND_DEPLOY_HOOK }}
        run: |
          curl "$deploy_url"

